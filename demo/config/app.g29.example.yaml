# Copy this file to app.local.yaml on g29. It keeps the app and Auto-AVSR
# Python environments isolated and calls kai's verified CLI as a subprocess.
recognition:
  job_timeout_seconds: 180
  partial_results: true
  speech:
    enabled: true
    provider: faster_whisper
    # Japanese-tuned model on the GPU: fetch it with
    # `scripts/prepare_models.py --speech-model kotoba-whisper-v2.0` and install the backend's gpu extra.
    model_path: models/speech/kotoba-whisper-v2.0
    device: cuda
    compute_type: float16
    beam_size: 1
    vad_silence_ms: 400
    partial_interval_ms: 700
    min_segment_ms: 300
    max_segment_ms: 10000
  lipread:
    provider: auto_avsr_cli
    runner_path: ../research/vsr/auto_avsr/scripts/run_vsr.sh
    model_version: auto-avsr-182b628
    max_upload_bytes: 8388608
  sign:
    provider: uni_sign_cli
    runner_path: ../research/sign/uni-sign/scripts/run_online.py
    python_path: ../research/sign/uni-sign/.venv/bin/python
    model_version: uni-sign-how2sign-pose-only
    max_upload_bytes: 8388608
    max_frames: 200
