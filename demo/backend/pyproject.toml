[project]
name = "kotoba-link"
version = "0.1.0"
description = "Accessible multimodal conversation server"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7", "python-dotenv>=1.0,<2", "argon2-cffi>=23.1,<26",
  "numpy>=2.1,<3", "httpx>=0.28,<1"
]

[project.optional-dependencies]
inference = ["faster-whisper>=1.1,<2", "onnxruntime>=1.20,<2", "huggingface-hub>=0.28,<1"]
training = ["torch>=2.6,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
